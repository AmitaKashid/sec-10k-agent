name: Backend and evaluation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      SEC_USER_AGENT: ci-tests@example.com
      DATABASE_URL: postgresql+asyncpg://sec_agent:test@localhost:5432/sec_agent_test
      LANGGRAPH_CHECKPOINTER_ENABLED: "false"
      ASK_TOKEN_LIMITER_ENABLED: "false"
      ANON_LIFETIME_ENABLED: "false"
      EXPOSE_TRACE_URLS: "false"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.13.3

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run provider and evaluation tests
        run: |
          uv run --frozen --extra dev pytest \
            tests/unit/test_gemini_embeddings.py \
            tests/unit/test_groq_runtime.py \
            tests/unit/test_memory_config.py \
            tests/unit/test_langfuse_v4.py \
            ../evals/tests \
            -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore