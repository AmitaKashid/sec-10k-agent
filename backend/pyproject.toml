[project]
name = "sec-10k-agent"
version = "0.1.0"
description = "SEC 10-K diligence agent — grounded answers with verifiable citations"
requires-python = ">=3.11"
dependencies = [
    # HTTP + retry + rate limit
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "tenacity>=9.0",
    # config + models
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.10.1",  # CVE-2024-53861 (issuer-confusion) fixed in 2.10.1
    # agent + LLM
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-groq>=0.2",
    "langfuse==4.18.0",  # OpenTelemetry request and node tracing
    # data ingestion
    "openai>=1.40",
    "tiktoken>=0.7",
    "edgartools>=2.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real external services; opt-in only",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# N818: Edgar* exception names (EdgarNotFound, EdgarRateLimited) are intentional per LLD 1.
ignore = ["E501", "N818"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
