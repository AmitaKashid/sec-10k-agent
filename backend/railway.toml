# Tell Railway to build this service from the Dockerfile in this
# directory, not Railpack auto-detect. Required because `railway up`
# CLI uploads ignore the dashboard's Root Directory + Builder fields
# (those only apply to GitHub-triggered builds).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
